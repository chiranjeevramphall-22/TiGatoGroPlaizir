{% extends 'bakery/base.html' %}
{% load static %}

{% block content %}

<section class="auth-page" style="background-image: url('{% static "images/login-bg.jpg" %}');">
    
    <div class="auth-card">
        <p class="section-label">WELCOME BACK</p>
        <h1>Log In</h1>
        <p class="auth-subtitle">No account yet? <a href="{% url 'signup' %}">Sign up here</a></p>

        <form method="POST" class="auth-form">
            {% csrf_token %}
            
            <label for="username">USERNAME</label>
            <input type="text" id="username" name="username" placeholder="Your username" required>

            <label for="password">PASSWORD</label>
            <input type="password" id="password" name="password" placeholder="Your password" required>

            <button type="submit" class="auth-btn">Log In</button>
        </form>
        
        <p class="auth-footer">This is the login page.</p>
    </div>

</section>

{% endblock %}
